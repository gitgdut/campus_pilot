<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#4b8df8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#28365a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#62708d"/>
    </marker>
    <style>
      .title { font: 700 28px 'DejaVu Sans',sans-serif; fill:#1f2740; }
      .subtitle { font: 400 14px 'DejaVu Sans',sans-serif; fill:#66718b; }
      .box-title { font: 700 17px 'DejaVu Sans',sans-serif; fill:#222b45; }
      .box-text { font: 400 12px 'DejaVu Sans',sans-serif; fill:#58637c; }
      .white-title { font: 700 18px 'DejaVu Sans',sans-serif; fill:#fff; }
      .white-text { font: 400 12px 'DejaVu Sans',sans-serif; fill:#eef4ff; }
      .label { font: 600 11px 'DejaVu Sans',sans-serif; fill:#4f5c78; }
      .arrow { fill:none; stroke:#62708d; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>
  <rect width="1400" height="820" rx="30" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" class="title">CampusPilot System Architecture</text>
  <text x="700" y="94" text-anchor="middle" class="subtitle">Natural-language reasoning, MCP tool execution and external services</text>

  <g filter="url(#shadow)">
    <rect x="55" y="275" width="220" height="150" rx="24" fill="#ffffff" stroke="#d8def0" stroke-width="2"/>
    <circle cx="165" cy="315" r="26" fill="#fff1d8"/>
    <text x="165" y="324" text-anchor="middle" class="box-title">U</text>
    <text x="165" y="365" text-anchor="middle" class="box-title">User</text>
    <text x="165" y="395" text-anchor="middle" class="box-text">Natural-language request</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="345" y="250" width="250" height="200" rx="24" fill="#ffffff" stroke="#d8def0" stroke-width="2"/>
    <text x="470" y="300" text-anchor="middle" class="box-title">Streamlit Web UI</text>
    <text x="470" y="337" text-anchor="middle" class="box-text">Chat and conversation history</text>
    <text x="470" y="367" text-anchor="middle" class="box-text">Tasks and tool-call trace</text>
    <text x="470" y="397" text-anchor="middle" class="box-text">Markdown downloads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="170" width="300" height="360" rx="28" fill="url(#agent)"/>
    <text x="815" y="220" text-anchor="middle" class="white-title">Agent Host</text>
    <rect x="705" y="250" width="220" height="90" rx="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="815" y="283" text-anchor="middle" class="white-title" font-size="19">Large Language Model</text>
    <text x="815" y="315" text-anchor="middle" class="white-text">Understand · Decide · Respond</text>
    <rect x="705" y="365" width="220" height="65" rx="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="815" y="405" text-anchor="middle" class="white-title" font-size="19">MCP Client</text>
    <rect x="705" y="452" width="220" height="48" rx="16" fill="#ffffff" fill-opacity="0.16"/>
    <text x="815" y="482" text-anchor="middle" class="white-text">Context and tool-call loop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1035" y="210" width="310" height="280" rx="26" fill="#ffffff" stroke="#bbb7ff" stroke-width="3"/>
    <text x="1190" y="258" text-anchor="middle" class="box-title">MCP Server</text>
    <text x="1190" y="290" text-anchor="middle" class="box-text">8 standardized tools</text>
    <rect x="1070" y="318" width="240" height="42" rx="12" fill="#f0efff"/>
    <text x="1190" y="345" text-anchor="middle" class="box-text">Task CRUD and completion</text>
    <rect x="1070" y="374" width="240" height="42" rx="12" fill="#e9f6ff"/>
    <text x="1190" y="401" text-anchor="middle" class="box-text">Plan generation and export</text>
    <rect x="1070" y="430" width="240" height="42" rx="12" fill="#ecfbf3"/>
    <text x="1190" y="457" text-anchor="middle" class="box-text">Live weather lookup</text>
  </g>

  <path d="M275 350 H335" class="arrow"/>
  <path d="M595 350 H655" class="arrow"/>
  <path d="M965 350 H1025" class="arrow"/>
  <text x="305" y="255" text-anchor="middle" class="label">Request / response</text>
  <text x="625" y="225" text-anchor="middle" class="label">Messages</text>
  <text x="995" y="190" text-anchor="middle" class="label">JSON-RPC</text>

  <g filter="url(#shadow)">
    <rect x="180" y="650" width="260" height="115" rx="22" fill="#fff" stroke="#d8def0" stroke-width="2"/>
    <text x="310" y="697" text-anchor="middle" class="box-title">SQLite</text>
    <text x="310" y="730" text-anchor="middle" class="box-text">Tasks and conversation memory</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="570" y="650" width="260" height="115" rx="22" fill="#fff" stroke="#a9dfc3" stroke-width="2"/>
    <text x="700" y="697" text-anchor="middle" class="box-title">Open-Meteo</text>
    <text x="700" y="730" text-anchor="middle" class="box-text">Geocoding and forecasts</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="960" y="650" width="260" height="115" rx="22" fill="#fff" stroke="#f0c892" stroke-width="2"/>
    <text x="1090" y="697" text-anchor="middle" class="box-title">Markdown Files</text>
    <text x="1090" y="730" text-anchor="middle" class="box-text">Study-plan export and download</text>
  </g>

  <path d="M1120 490 C1080 575, 425 560, 315 640" class="arrow"/>
  <path d="M1185 490 C1160 580, 790 570, 705 640" class="arrow"/>
  <path d="M1245 490 C1280 575, 1160 595, 1095 640" class="arrow"/>
  <text x="585" y="575" text-anchor="middle" class="label">Persistence</text>
  <text x="875" y="590" text-anchor="middle" class="label">HTTP API</text>
  <text x="1170" y="585" text-anchor="middle" class="label">Safe write</text>
</svg>
